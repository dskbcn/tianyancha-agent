name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR supersedes its running check; every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Agent discovery needs no credentials: it compiles the agent without calling a model.
      - run: pnpm check:agent
      # Production builds: eve build (agent, with vendored libraries) and vite build (web).
      - run: pnpm build
