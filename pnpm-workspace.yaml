packages:
  - apps/*
  - packages/*

# Exact versions everywhere, as in face-platform: drift should be a deliberate commit.
saveExact: true

# Versions shared by more than one package.
catalog:
  '@types/node': 24.12.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  eve: 0.82.0
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.1
  zod: 4.5.4

allowBuilds:
  esbuild: true

# Optional native compression addons pulled in by just-bash; not needed (eve docs, just-bash).
ignoredOptionalDependencies:
  - '@mongodb-js/zstd'
  - node-liblzma

# eve and the AI SDK ship often; pin exact versions newer than the release-age window.
minimumReleaseAgeExclude:
  - eve
  - ai
  - '@ai-sdk/*'
  - '@vercel/*'
  - '@workflow/*'
  - workflow
  - nitro
  - rolldown
  - '@rolldown/*'
